<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hamdan Family Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <h1>🌈 Hamdan Family Adventure 🌈</h1>

    <div class="info-bar">
      <div>⭐ Score: <span id="score">0</span></div>
      <div>❤️ Lives: <span id="lives">3</span></div>
    </div>

    <div class="game-area" id="gameArea">

      <!-- Baby Hamdan -->
      <div class="player" id="player">
        👶
        <span>Hamdan</span>
      </div>

      <!-- Amar -->
      <div class="character amar">
        👨
        <span>Amar</span>
      </div>

      <!-- Zoya -->
      <div class="character zoya">
        👩
        <span>Zoya</span>
      </div>

      <!-- Falling stars -->
      <div class="star">⭐</div>

    </div>

    <div class="controls">
      <p>🎮 Move Hamdan with ⬅️ ➡️ Arrow Keys</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
